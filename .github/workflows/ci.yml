name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      - run: npm run start & npx wait-on http://localhost:3000
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/parks
            http://localhost:3000/parks/acad
            http://localhost:3000/discover/month/jul
          uploadArtifacts: true
          temporaryPublicStorage: true
